- name: catalogue
  hosts: catalogue
  become: yes
  tasks: 
  - name: installing nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: creating roboshop user
    ansible.builtin.user:
      name: roboshop
  
  - name: creating app directory
    ansible.builtin.file:
      path: /tmp/app
      state: directory