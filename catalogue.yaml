- name: catalogue
  hosts: catalogue
  become: yes
  tasks: 
  - name: installing nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: creating roboshop user
    ansible.builtin.user:
      name: roboshop
  
  - name: creating app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: downloading urls
    ansible.builtin.get_url:
      url: https://roboshop-builds.s3.amazonaws.com/catalogue.zip
      dest: /tmp

  - name: unarchive files
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes  # no need search the file in somewhere location, it's already downloaded to local

  - name: npm install
    ansible.builtin.command:
      cmd: npm install
      chdir: /app

  - name: copy service files
    ansible.builtin.copy:
     src: catalogue.service
     dest: /etc/systemd/system/catalogue.service

  - name: daemon reload
    ansible.builtin.systemd_service:
      name: catalogue
      daemon_reload: true
      enabled: true
      state: started

  - name: copy files
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongodb.repo

  - name: install mongodb
    ansible.builtin.package:
     name: mongodb-mongosh
     state: present

  - name: get the categories count
    ansible.builtin.command:  mongosh --host mongodb.kranthi.bond --quiet --eval 'db = db.getSiblingDB("catalogue"); db.products.count()'
    register: product_count

  - name: printing the count
    ansible.builtin.debug:
      msg: "product count: {{product_count}}"

  - name: load cataloge data
    ansible.builtin.command: mongosh --host mongodb.kranthi.bond < /app/schema/catalogue.js
      